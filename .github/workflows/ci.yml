name: CI

# The point of extracting these modules was that they can be run, not only
# read. The same gate the full project uses, on the same three platforms:
# a green badge here is about this repository and nothing else.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # macOS minutes are billed at ten times the Linux rate, so that leg runs
  # weekly instead of on every push.
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

# A new push supersedes an older run for the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # Linux and Windows run on every push and sample the minimum and
        # current Node lines. The macOS leg moved to the weekly schedule
        # below: macOS minutes cost ten times Linux minutes.
        include:
          - os: ubuntu-latest
            node: '20'
          - os: windows-latest
            node: '22'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # bubblewrap is what confines shell commands on Linux. Installing it is
      # not enough on Ubuntu 24.04: AppArmor restricts unprivileged user
      # namespaces by default, so bwrap is present and cannot create the
      # namespace it needs. The runtime handles that by probing and falling
      # back — but a fallback here would mean the containment test never runs
      # in CI, which is the test worth running most.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc -- /bin/true \
            && echo "bubblewrap works on this runner" \
            || echo "bubblewrap unusable here; sandbox tests will skip"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # Where a sandbox is supposed to exist, its absence is a failure and
          # not a skip. Windows has no backend, so the flag is not set there.
          TITAN_CODE_REQUIRE_SANDBOX: ${{ runner.os == 'Windows' && '0' || '1' }}

  verify-macos:
    # Runs only on the weekly schedule: macOS minutes are billed at ten times
    # the Linux rate, which matters on a limited Actions allowance.
    if: github.event_name == 'schedule'
    name: macos-latest · node 24
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # Where a sandbox is supposed to exist, its absence is a failure and
          # not a skip. Windows has no backend, so the flag is not set there.
          TITAN_CODE_REQUIRE_SANDBOX: ${{ runner.os == 'Windows' && '0' || '1' }}
